services:
  - type: web
    name: smart-dorm-laundry
    env: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python database.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: PORT
        value: 10000
